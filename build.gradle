// Top-level build file where you can add configuration options common to all sub-projects/modules.
buildscript {
    ext.kotlin_version = "1.8.21"
    repositories {
        google()
        mavenCentral()
    }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.9.0'
        classpath "org.jetbrains.kotlin:kotlin-gradle-plugin:$kotlin_version"
        classpath "org.jetbrains.kotlin:kotlin-serialization:$kotlin_version"
        // NOTE: Do not place your application dependencies here; they belong
        // in the individual module build.gradle files
    }
}

allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Jitpack sets these as env vars; local/CI publish runs may pass them as -P properties instead.
def resolvePublicationProperty = { name ->
    providers.environmentVariable(name).orElse(providers.gradleProperty(name))
}

ext.publicationVersion = resolvePublicationProperty('JITPACK_VERSION')
    .orElse(resolvePublicationProperty('VERSION'))
    .orElse(resolvePublicationProperty('VERSION_NAME'))
    .orElse(provider { 'local' })
    .get()

task clean(type: Delete) {
    delete rootProject.buildDir
}